name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run unit tests
        run: npm test
